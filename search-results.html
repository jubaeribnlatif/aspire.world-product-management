<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Search — aspire.world</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1B3D; --ink-2:#152A5C;
    --royal:#2547F4; --royal-dark:#1B36C4; --royal-soft:#E7EBFE;
    --teal:#00A389; --teal-soft:#DFF5F1; --teal-text:#00806C;
    --violet:#6C4FF6; --violet-soft:#EFEAFE;
    --paper:#F7F7FB; --slate:#5B6472; --slate-soft:#EDEFF3;
    --border:#E3E6EE; --white:#FFFFFF;
    --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}
  :focus-visible{outline:2px solid var(--royal);outline-offset:2px;border-radius:6px;}
  .mono{font-family:var(--mono);}
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important;} }

  .topnav{background:var(--ink);color:var(--white);}
  .topnav-inner{max-width:1080px;margin:0 auto;padding:15px 28px;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:9px;}
  .brand-mark{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--royal),var(--violet));flex-shrink:0;}
  .brand-name{font-weight:700;font-size:14px;}
  .back-link{display:flex;align-items:center;gap:6px;font-size:12.5px;color:rgba(255,255,255,.6);}
  .back-link:hover{color:var(--white);}
  .btn{border-radius:999px;border:none;font-weight:600;font-size:13.5px;padding:10px 18px;display:inline-flex;align-items:center;gap:7px;}
  .btn-primary{background:var(--royal);color:var(--white);}
  .btn-sm{padding:7px 13px;font-size:12.5px;}
  .card{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);}

  /* HERO */
  .hero{background:radial-gradient(120% 150% at 100% 0%, #2A3E8F 0%, var(--ink) 55%);color:var(--white);position:relative;overflow:hidden;}
  .hero::before{content:'';position:absolute;inset:0;background:radial-gradient(460px 280px at 90% -10%, rgba(108,79,246,.32), transparent 60%);pointer-events:none;}
  .hero-inner{position:relative;z-index:1;padding:52px 0 44px;}
  .hero-eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#9DB0FF;margin-bottom:14px;}
  .hero-title{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.08;margin-bottom:26px;max-width:640px;}

  .search-box{display:flex;align-items:center;gap:14px;background:var(--white);border-radius:999px;padding:18px 26px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5);}
  .search-box svg{color:var(--slate);flex-shrink:0;}
  .search-input{border:none;outline:none;font-size:19px;width:100%;background:none;color:var(--ink);font-weight:500;}
  .search-input::placeholder{color:#A6ACBE;}
  .search-clear{color:var(--slate);flex-shrink:0;display:none;width:32px;height:32px;border-radius:50%;background:var(--slate-soft);align-items:center;justify-content:center;border:none;transition:background .15s ease;}
  .search-clear:hover{background:var(--border);color:var(--ink);}
  .search-clear.show{display:flex;}

  .chip-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px;align-items:center;}
  .chip-row-label{font-size:12.5px;color:rgba(255,255,255,.5);margin-right:2px;}
  .sugg-chip{font-size:13px;font-weight:600;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:var(--white);}
  .sugg-chip:hover{background:rgba(255,255,255,.16);}

  /* RESULT META BAR */
  .meta-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;padding:32px 0 20px;}
  .result-count{font-size:15px;color:var(--slate);}
  .result-count b{color:var(--ink);font-weight:700;}

  .tab-bar{display:flex;gap:9px;overflow-x:auto;margin-bottom:36px;padding-bottom:4px;}
  .tab-btn{background:var(--white);border:1.5px solid var(--border);border-radius:999px;font-size:13.5px;font-weight:700;color:var(--slate);padding:11px 19px;white-space:nowrap;display:flex;align-items:center;gap:9px;transition:background .15s ease,border-color .15s ease,color .15s ease;}
  .tab-btn.active{background:var(--ink);color:var(--white);border-color:var(--ink);}
  .tab-btn:hover:not(.active){border-color:var(--royal);color:var(--ink);}
  .tab-count{font-family:var(--mono);font-size:11px;color:var(--slate);background:var(--slate-soft);padding:2px 9px;border-radius:999px;}
  .tab-btn.active .tab-count{background:rgba(255,255,255,.18);color:var(--white);}

  /* GROUPS */
  .result-group{margin-bottom:52px;}
  .group-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;}
  .group-title{font-size:19px;font-weight:800;letter-spacing:-.01em;}
  .group-title-count{font-family:var(--mono);font-size:13px;color:var(--slate);font-weight:500;margin-left:8px;}
  .group-see-all{font-size:13.5px;font-weight:700;color:var(--royal);}

  /* IMAGE CARDS (university / country) */
  .image-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
  .image-card{border-radius:var(--r-xl);overflow:hidden;border:1px solid var(--border);background:var(--white);transition:transform .18s ease,box-shadow .18s ease;position:relative;}
  .image-card:hover{transform:translateY(-3px);box-shadow:0 22px 44px -22px rgba(14,27,61,.4);}
  .image-photo{height:150px;position:relative;overflow:hidden;}
  .image-photo svg{width:100%;height:100%;display:block;transition:transform .3s ease;}
  .image-card:hover .image-photo svg{transform:scale(1.05);}
  .image-flag-badge{position:absolute;top:14px;left:14px;background:rgba(14,27,61,.55);backdrop-filter:blur(4px);color:var(--white);font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;display:flex;align-items:center;gap:6px;z-index:2;}
  .image-save-btn{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:rgba(14,27,61,.55);backdrop-filter:blur(4px);color:var(--white);display:flex;align-items:center;justify-content:center;z-index:2;opacity:0;transition:opacity .15s ease;}
  .image-card:hover .image-save-btn{opacity:1;}
  .image-save-btn.saved{opacity:1;background:var(--teal);}
  .image-body{padding:20px 22px 22px;}
  .image-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .image-title{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.2;}
  .image-tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0;}
  .image-sub{font-size:13.5px;color:var(--slate);line-height:1.55;margin-bottom:14px;}
  .image-stat-row{display:flex;gap:16px;flex-wrap:wrap;}
  .image-stat{font-size:12.5px;color:var(--ink);font-weight:600;display:flex;align-items:center;gap:5px;}
  .image-stat svg{color:var(--slate);flex-shrink:0;}

  /* RICH ROWS (scholarship / agency / bank) */
  .rich-row{display:flex;gap:20px;padding:24px 26px;margin-bottom:14px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;align-items:flex-start;}
  .rich-row:hover{transform:translateY(-2px);box-shadow:0 20px 40px -22px rgba(14,27,61,.35);}
  .rich-icon{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:var(--white);flex-shrink:0;}
  .rich-body{flex:1;min-width:0;}
  .rich-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .rich-title{font-size:18px;font-weight:800;letter-spacing:-.01em;}
  .rich-flag{font-size:16px;}
  .rich-tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .rich-sub{font-size:13.5px;color:var(--slate);line-height:1.55;margin-bottom:14px;max-width:560px;}
  .rich-stat-row{display:flex;gap:22px;flex-wrap:wrap;}
  .rich-stat-label{font-family:var(--mono);font-size:9.5px;color:var(--slate);letter-spacing:.03em;text-transform:uppercase;}
  .rich-stat-val{font-size:13.5px;font-weight:700;margin-top:2px;}
  .rich-side{display:flex;flex-direction:column;align-items:flex-end;gap:12px;flex-shrink:0;}
  .rich-arrow{color:var(--slate);}
  .rich-save-btn{width:32px;height:32px;border-radius:50%;background:var(--paper);border:1px solid var(--border);color:var(--slate);display:flex;align-items:center;justify-content:center;}
  .rich-save-btn.saved{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-text);}

  .tag-strong{background:var(--teal-soft);color:var(--teal-text);}
  .tag-partial{background:var(--violet-soft);color:#5333C9;}
  .tag-verified{background:var(--teal-soft);color:var(--teal-text);}
  .tag-target{background:var(--royal-soft);color:var(--royal-dark);}

  /* STORY CARDS (articles / video) */
  .story-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
  .story-card{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--border);background:var(--white);display:flex;gap:0;transition:transform .15s ease,box-shadow .15s ease;}
  .story-card:hover{transform:translateY(-2px);box-shadow:0 18px 36px -20px rgba(14,27,61,.35);}
  .story-thumb{width:110px;flex-shrink:0;position:relative;overflow:hidden;}
  .story-thumb svg{width:100%;height:100%;display:block;}
  .story-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .story-play-icon{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .story-body{padding:16px 18px;flex:1;min-width:0;}
  .story-type-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .story-type-chip{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:999px;}
  .story-type-chip.article{background:var(--royal-soft);color:var(--royal-dark);}
  .story-type-chip.video{background:var(--violet-soft);color:#5333C9;}
  .story-meta{font-size:11px;color:var(--slate);}
  .story-title{font-size:14.5px;font-weight:700;line-height:1.35;}

  /* EMPTY STATE */
  .empty-state{text-align:center;padding:90px 20px;}
  .empty-icon{width:64px;height:64px;border-radius:50%;background:var(--slate-soft);color:var(--slate);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
  .empty-title{font-size:20px;font-weight:800;margin-bottom:8px;}
  .empty-sub{font-size:14px;color:var(--slate);max-width:400px;margin:0 auto 22px;line-height:1.6;}

  .footer-cta{display:flex;justify-content:space-between;align-items:center;padding:26px 30px;margin:16px 0 70px;flex-wrap:wrap;gap:16px;}
  .footer-cta-text{font-size:16px;font-weight:800;}
  .footer-cta-sub{font-size:13px;color:var(--slate);margin-top:3px;}

  @media(max-width:760px){
    .image-grid, .story-grid{grid-template-columns:1fr;}
    .footer-cta{flex-direction:column;align-items:flex-start;}
    .rich-row{flex-direction:column;}
    .rich-side{flex-direction:row;width:100%;justify-content:space-between;}
  }
</style>
</head>

        '<circle cx="182" cy="14" r="7" fill="#2547F4" opacity=".7"/>' +
        '<rect x="40" y="80" width="40" height="70" fill="#1B2E63"/>' +
        '<rect x="90" y="60" width="30" height="90" fill="#152A5C"/>' +
        '<rect x="230" y="70" width="34" height="80" fill="#1B2E63"/>' +
        '<rect x="272" y="50" width="24" height="100" fill="#152A5C"/>' +
        '<rect x="304" y="85" width="60" height="65" fill="#1B2E63"/>' +
        '<rect x="178" y="55" width="8" height="12" fill="#5FE0C7" opacity=".55"/>' +
        '<rect x="178" y="75" width="8" height="12" fill="#5FE0C7" opacity=".55"/>' +
        '</svg>';
    }
    return '';
  }

  function iconSvg(type){ return '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+TYPE_META[type].icon+'</svg>'; }

  function filterData(query){
    var q = query.trim().toLowerCase();
    if(!q) return [];
    return DATA.filter(function(item){
      if(item.title.toLowerCase().indexOf(q) > -1) return true;
      return item.kw.some(function(k){ return k.indexOf(q) > -1; });
    });
  }

  function renderTabs(results){
    var counts = {};
    TYPE_ORDER.forEach(function(t){ counts[t] = 0; });
    results.forEach(function(r){ counts[r.type]++; });
    var html = '<button class="tab-btn'+(activeTab==='all'?' active':'')+'" onclick="setTab(\'all\')">All <span class="tab-count">'+results.length+'</span></button>';
    TYPE_ORDER.forEach(function(t){
      html += '<button class="tab-btn'+(activeTab===t?' active':'')+'" onclick="setTab(\''+t+'\')">'+TYPE_META[t].label+' <span class="tab-count">'+counts[t]+'</span></button>';
    });
    document.getElementById('tabBar').innerHTML = html;
  }

  function statHtml(stats){
    if(!stats) return '';
    return stats.map(function(s){
      return '<div><div class="rich-stat-label">'+s[1]+'</div><div class="rich-stat-val">'+s[0]+'</div></div>';
    }).join('');
  }
  function imageStatHtml(stats){
    if(!stats) return '';
    return stats.map(function(s){ return '<span class="image-stat">'+s[0]+' '+s[1]+'</span>'; }).join('');
  }

  function imageCardHtml(item){
    var tagHtml = item.tag ? '<span class="image-tag '+item.tagClass+'">'+item.tag+'</span>' : '';
    var saved = savedIds[item.id] ? ' saved' : '';
    return '<div class="image-card">' +
      '<a href="'+item.link+'">' +
        '<div class="image-photo">'+svgIllustration(item.illustration)+
          '<span class="image-flag-badge">'+item.flag+' '+item.flagName+'</span>' +
        '</div>' +
      '</a>' +
      '<button class="image-save-btn'+saved+'" onclick="toggleSave(event,'+item.id+')">'+(savedIds[item.id]?'<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M17 3H7a2 2 0 00-2 2v16l7-4 7 4V5a2 2 0 00-2-2z"/></svg>':'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3H7a2 2 0 00-2 2v16l7-4 7 4V5a2 2 0 00-2-2z"/></svg>')+'</button>' +
      '<a href="'+item.link+'"><div class="image-body">' +
        '<div class="image-title-row"><span class="image-title">'+item.title+'</span>'+tagHtml+'</div>' +
        '<div class="image-sub">'+item.sub+'</div>' +
        '<div class="image-stat-row">'+imageStatHtml(item.stats)+'</div>' +
      '</div></a>' +
    '</div>';
  }

  function richRowHtml(item){
    var tagHtml = item.tag ? '<span class="rich-tag '+item.tagClass+'">'+item.tag+'</span>' : '';
    var flagHtml = item.flag ? '<span class="rich-flag">'+item.flag+'</span>' : '';
    var iconContent = item.mark ? item.mark : iconSvg(item.type);
    var iconStyle = item.mark ? 'font-family:var(--mono);font-weight:700;font-size:13px;' : '';
    var saved = savedIds[item.id];
    return '<div class="card rich-row" onclick="location.href=\''+item.link+'\'">' +
      '<div class="rich-icon" style="background:'+(item.markColor||TYPE_META[item.type].color)+';'+iconStyle+'">'+iconContent+'</div>' +
      '<div class="rich-body">' +
        '<div class="rich-title-row">'+flagHtml+'<span class="rich-title">'+item.title+'</span>'+tagHtml+'</div>' +
        '<div class="rich-sub">'+item.sub+'</div>' +
        '<div class="rich-stat-row">'+statHtml(item.stats)+'</div>' +
      '</div>' +
      '<div class="rich-side">' +
        '<button class="rich-save-btn'+(saved?' saved':'')+'" onclick="toggleSave(event,'+item.id+')">'+(saved?'<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17 3H7a2 2 0 00-2 2v16l7-4 7 4V5a2 2 0 00-2-2z"/></svg>':'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3H7a2 2 0 00-2 2v16l7-4 7 4V5a2 2 0 00-2-2z"/></svg>')+'</button>' +
        '<svg class="rich-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>' +
      '</div>' +
    '</div>';
  }

  function storyCardHtml(item){
    var isVideo = item.mediaType === 'video';
    var thumb = isVideo
      ? '<svg viewBox="0 0 110 90" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><rect width="110" height="90" fill="#EFEAFE"/><circle cx="55" cy="45" r="45" fill="#6C4FF6" opacity=".15"/></svg>'
      : '<svg viewBox="0 0 110 90" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><rect width="110" height="90" fill="#E7EBFE"/><circle cx="55" cy="45" r="45" fill="#2547F4" opacity=".12"/></svg>';
    var playHtml = isVideo ? '<div class="story-play"><div class="story-play-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div></div>' : '';
    return '<a class="story-card" href="'+item.link+'">' +
      '<div class="story-thumb">'+thumb+playHtml+'</div>' +
      '<div class="story-body">' +
        '<div class="story-type-row"><span class="story-type-chip '+item.mediaType+'">'+item.mediaType.toUpperCase()+'</span><span class="story-meta">'+item.meta+'</span></div>' +
        '<div class="story-title">'+item.title+'</div>' +
      '</div>' +
    '</a>';
  }

  function cardHtml(item){
    var layout = TYPE_META[item.type].layout;
    if(layout === 'image') return imageCardHtml(item);
    if(layout === 'story') return storyCardHtml(item);
    return richRowHtml(item);
  }

  function renderResults(query){
    var results = filterData(query);
    var area = document.getElementById('resultsArea');
    var countEl = document.getElementById('resultCount');

    renderTabs(results);

    if(!query.trim()){
      area.innerHTML = '';
      countEl.textContent = '';
      return;
    }

    countEl.innerHTML = results.length ? '<b>'+results.length+'</b> result'+(results.length===1?'':'s')+' for \u2018'+query+'\u2019' : '';

    if(results.length === 0){
      area.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div>' +
          '<div class="empty-title">No results for \u2018'+query+'\u2019</div>' +
          '<div class="empty-sub">Try a broader term, or browse scholarships and universities directly using the links below.</div>' +
        '</div>';
      return;
    }

    if(activeTab === 'all'){
      var html = '';
      TYPE_ORDER.forEach(function(t){
        var group = results.filter(function(r){ return r.type === t; });
        if(!group.length) return;
        var layout = TYPE_META[t].layout;
        var shown = group.slice(0, layout === 'rich' ? 3 : 4);
        var wrapOpen = layout === 'image' ? '<div class="image-grid">' : (layout === 'story' ? '<div class="story-grid">' : '');
        var wrapClose = (layout === 'image' || layout === 'story') ? '</div>' : '';
        html += '<div class="result-group">' +
          '<div class="group-head"><span class="group-title">'+TYPE_META[t].label+'<span class="group-title-count">'+group.length+'</span></span>' +
          (group.length > shown.length ? '<span class="group-see-all" style="cursor:pointer;" onclick="setTab(\''+t+'\')">See all '+group.length+' →</span>' : '') +
          '</div>' +
          wrapOpen + shown.map(cardHtml).join('') + wrapClose +
          '</div>';
      });
      area.innerHTML = html;
    } else {
      var filtered = results.filter(function(r){ return r.type === activeTab; });
      var layout = TYPE_META[activeTab].layout;
      if(layout === 'image'){
        area.innerHTML = '<div class="image-grid">' + filtered.map(cardHtml).join('') + '</div>';
      } else if(layout === 'story'){
        area.innerHTML = '<div class="story-grid">' + filtered.map(cardHtml).join('') + '</div>';
      } else {
        area.innerHTML = filtered.map(cardHtml).join('');
      }
    }
  }

  function toggleSave(e, id){
    e.preventDefault();
    e.stopPropagation();
    savedIds[id] = !savedIds[id];
    renderResults(document.getElementById('searchInput').value);
  }

  function setTab(t){
    activeTab = t;
    renderResults(document.getElementById('searchInput').value);
  }

  function runSearch(q){
    document.getElementById('searchInput').value = q;
    activeTab = 'all';
    handleInput();
  }

  function clearSearch(){
    document.getElementById('searchInput').value = '';
    activeTab = 'all';
    handleInput();
    document.getElementById('searchInput').focus();
  }

  function handleInput(){
    var val = document.getElementById('searchInput').value;
    document.getElementById('clearBtn').classList.toggle('show', val.length > 0);
    renderResults(val);
  }

  document.getElementById('searchInput').addEventListener('input', handleInput);
  handleInput();
</script>
</body>
</html>
